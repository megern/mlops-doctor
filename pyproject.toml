[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-doctor"
version = "0.4.0"
description = "Diagnose tabular pipeline schema, split leakage and standardized mean drift."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi==0.143.0", "pydantic==2.14.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "pip-audit==2.10.1", "bandit==1.9.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["static/*"]
